ignore:
  name: Akku aus Liste nehmen
  description: Gerät aus der Polster-Akku-Ansicht ausblenden
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
          device_class: battery

restore:
  name: Akku wieder anzeigen
  description: Ausgeblendetes Gerät wieder in die Liste holen
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor

restore_all:
  name: Alle wieder anzeigen
  description: Ignore-Liste leeren
